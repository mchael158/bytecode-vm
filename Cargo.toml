[workspace]
resolver = "2"
members = [
    "crates/byteflow-bytecode",
    "crates/byteflow-vm",
    "crates/byteflow-scheduler",
    "crates/byteflow",
    "crates/byteflow-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Byteflow Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mchael158/bytecode-vm"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"     # workers must be able to catch process panics, see byteflow-scheduler::worker
debug = false

[profile.bench]
inherits = "release"
