[package]
name = "byteflow-actors"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/mchael158/bytecode-vm"
documentation = "https://docs.rs/byteflow-actors"
description = "Embeddable flow runtime: bytecode VM, M:N scheduler, Atomic Hop + FlowCap, supervisor"
readme = "README.md"
keywords = ["flows", "bytecode", "vm", "concurrency", "embedded"]
categories = ["concurrency", "emulators"]
include = [
    "src/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE*",
]
# Library crate name is `byteflow` so dependents write `use byteflow::...`.
# Package name on crates.io is `byteflow-actors` (`byteflow` is taken).
[lib]
name = "byteflow"
path = "src/lib.rs"

[[bin]]
name = "byteflow"
path = "src/bin/byteflow.rs"
doc = false

[dependencies]
crossbeam-deque = "0.8"
num_cpus = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
